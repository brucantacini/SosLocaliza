<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1F0ED" />
    <style>
      :root { background: #F1F0ED; color-scheme: light; }
      :root[data-theme="dark"] { background: #102A43; color-scheme: dark; }
    </style>
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('sos-localiza-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark'
          ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#102A43' : '#F1F0ED';
      })();
    </script>
    <meta name="description" content="SOS Localiza: mapa meteorológico, registro de ocorrências e orientações de segurança." />
    <title>SOS LOCALIZA — cuidado perto de você</title>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
