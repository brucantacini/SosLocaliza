spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: sos-localiza
  
  profiles:
    # Padrão: Oracle (FIAP). Para H2 local: SPRING_PROFILES_ACTIVE=dev ou --spring.profiles.active=dev
    active: ${SPRING_PROFILES_ACTIVE:oracle-fiap}
    group:
      prod:
        - oracle-fiap

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

# Configurações do Twilio
# ⚠️ Por segurança, use variáveis de ambiente:
# TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_TRIAL_NUMBER, TWILIO_ENABLED
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  trial-number: ${TWILIO_TRIAL_NUMBER:+12176248670}
  enabled: ${TWILIO_ENABLED:false}

# Configurações do Swagger/OpenAPI - Temporariamente desabilitado
# springdoc:
#   api-docs:
#     path: /api-docs
#   swagger-ui:
#     path: /swagger-ui.html
#     operationsSorter: method
#     tagsSorter: alpha
#     tryItOutEnabled: true

---
spring:
  config:
    activate:
      on-profile: oracle

  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}:${ORACLE_SID:xe}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_USERNAME:soslocaliza}
    password: ${ORACLE_PASSWORD:password}

  flyway:
    enabled: true
    locations: classpath:db/migration/oracle
    baseline-on-migrate: true
    validate-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
