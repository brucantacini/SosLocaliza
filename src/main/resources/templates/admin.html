<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Alertas Recebidos — SOS Localiza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<main class="container-fluid pb-5 px-3">
    <h1 class="h3 mb-2">Alertas Recebidos</h1>
    <p class="text-muted small mb-3">A tabela é atualizada automaticamente a cada 10 segundos.</p>
    <div class="table-responsive">
        <table class="table table-sm table-striped align-middle">
            <thead>
            <tr>
                <th>Data (dia e hora)</th>
                <th>Remetente</th>
                <th>Telefone</th>
                <th>Localização</th>
                <th>Evento</th>
                <th>Mensagem</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${smsLinhas}">
                <td th:text="${s.dataEnvio != null ? #temporals.format(s.dataEnvio, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                <td th:text="${s.remetente}"></td>
                <td th:text="${s.telefone}"></td>
                <td class="text-truncate" style="max-width: 200px;" th:text="${s.localizacao}" th:title="${s.localizacao}"></td>
                <td class="text-truncate" style="max-width: 180px;" th:text="${s.evento}" th:title="${s.evento}"></td>
                <td class="text-truncate" style="max-width: 280px;" th:text="${s.mensagem}" th:title="${s.mensagem}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${smsPage.totalPages > 1}" aria-label="Paginação">
        <ul class="pagination">
            <li class="page-item" th:classappend="${smsPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin(page=${smsPage.number - 1})}">Anterior</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${smsPage.number + 1} + ' / ' + ${smsPage.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${smsPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin(page=${smsPage.number + 1})}">Próxima</a>
            </li>
        </ul>
    </nav>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  /*<![CDATA[*/
  (function () {
    var REFRESH_MS = 10000; /* 5000 = 5 s */
    setInterval(function () {
      window.location.reload();
    }, REFRESH_MS);
  })();
  /*]]>*/
</script>
</body>
</html>
