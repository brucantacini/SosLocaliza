<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Socorro (conta logada) — SOS Localiza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<main class="container pb-5">
    <h1 class="h3 mb-2">Pedido de socorro (SMS)</h1>
    <p class="text-secondary small mb-3">Nome e telefone usam o seu cadastro de usuário — preencha apenas o evento e a mensagem.</p>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <p class="text-muted small mb-3" th:if="${nomeContato}">
        Enviando como <strong th:text="${nomeContato}">Nome</strong>
        <span th:if="${telefoneResumo}"> · <span th:text="${telefoneResumo}">11 99999-0001</span></span>
        <span th:if="${localizacaoResumo}"> - Localização: <span th:text="${localizacaoResumo}">Rua ABC 123, Sao Paulo</span></span>
    </p>
    <form th:action="@{/socorro}" th:object="${form}" method="post" class="needs-validation" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
        </div>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="idEvento">Tipo de evento</label>
                <select id="idEvento" class="form-select" th:field="*{idEvento}" required>
                    <option value="">Selecione...</option>
                    <option th:each="e : ${eventos}" th:value="${e.idEvento}" th:text="${e.nomeEvento}"></option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('idEvento')}" th:errors="*{idEvento}"></div>
            </div>
            <div class="col-12">
                <label class="form-label" for="mensagem">Mensagem</label>
                <textarea id="mensagem" class="form-control" rows="4" th:field="*{mensagem}" maxlength="1000" required placeholder="Descreva a situação e o que precisa"></textarea>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('mensagem')}" th:errors="*{mensagem}"></div>
            </div>
        </div>
        <button type="submit" class="btn btn-danger mt-3">Enviar pedido de socorro</button>
    </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
