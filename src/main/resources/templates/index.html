<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Início — SOS Localiza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<main class="container pb-5">
    <h1 class="h2 mb-3">Emergências climáticas</h1>
    <p class="lead">
        Use o fluxo <strong>Pedido de socorro (SMS)</strong> para enviar alerta vinculado a um tipo de evento.
        O painel administrativo exibe estatísticas e o histórico de SMS (somente perfil administrador).
    </p>
    <ul class="list-unstyled mt-4">
        <li sec:authorize="hasAnyRole('USER','ADMIN')" class="mb-2">
            <a th:href="@{/socorro}" class="btn btn-outline-primary">Abrir pedido de socorro por SMS</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')" class="mb-2">
            <a th:href="@{/admin}" class="btn btn-outline-secondary">Abrir painel administrativo</a>
        </li>
    </ul>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
