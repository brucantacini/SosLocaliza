---
spring:
  config:
    activate:
      on-profile: dev

  h2:
    console:
      enabled: true
      path: /h2-console
  
  # H2 em ficheiro: SMS e utilizadores persistem entre reinícios (perfil dev só; produção = Oracle).
  datasource:
    url: jdbc:h2:file:./data/soslocaliza-dev;AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  flyway:
    enabled: true
    locations: classpath:db/migration/h2

  thymeleaf:
    cache: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false

# Configurações do Twilio - Removido (usando simulação local)
# twilio:
#   account-sid: ${TWILIO_ACCOUNT_SID:ACb84a1c0afbb6628678209002a9db4d6c}
#   auth-token: ${TWILIO_AUTH_TOKEN:7a420445aa2fc29161ac7cc22e2b8353}
#   trial-number: ${TWILIO_TRIAL_NUMBER:+15005550006}

# Configurações do servidor (8082 para não conflitar com Metro Expo em 8081 no sosLocal)
server:
  port: 8082

# Configurações de logging para desenvolvimento
logging:
  level:
    com.example.SosLocaliza: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.twilio: DEBUG
