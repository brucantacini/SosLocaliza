spring:
  config:
    activate:
      on-profile: oracle-fiap

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: false
  
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:oracle.fiap.com.br}:${ORACLE_PORT:1521}:${ORACLE_SID:ORCL}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_USERNAME:rm560242}
    password: ${ORACLE_PASSWORD:}
  
  flyway:
    enabled: true
    locations: classpath:db/migration/oracle
    baseline-on-migrate: true
    validate-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

# Porta 8082: mesmo padrão do perfil dev (Expo/Metro costuma usar 8081)
server:
  port: ${SERVER_PORT:8082}

# Configurações do Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Configurações de logging para Oracle FIAP
logging:
  level:
    com.example.SosLocaliza: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    oracle.jdbc: WARN
