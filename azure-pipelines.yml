# Pipeline CI + CD — SOS Localiza (sem UseJavaVersion / Cache / Maven task — só script + artefato + Azure CLI)
#
# Substitua REPLACE_AZURE_RM_CONNECTION pelo nome da Service connection (Azure Resource Manager).

trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  jarName: SosLocaliza-0.0.1-SNAPSHOT.jar
  AZURE_RESOURCE_GROUP: rg-soslocaliza
  AZURE_WEBAPP_NAME: app-soslocaliza-560242

stages:
  - stage: CI_Build
    displayName: CI — Build (Maven via apt)
    jobs:
      - job: MavenBuild
        displayName: Compilar e publicar JAR
        steps:
          - checkout: self

          - script: |
              set -euo pipefail
              sudo apt-get update -qq
              sudo apt-get install -y maven
              MVN_EXTRA=""
              if sudo apt-get install -y openjdk-21-jdk-headless; then
                export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
              else
                sudo apt-get install -y openjdk-17-jdk-headless
                export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
                MVN_EXTRA="-Dmaven.compiler.release=17"
              fi
              export PATH="$JAVA_HOME/bin:$PATH"
              java -version
              mvn -version
              mvn clean package -DskipTests -B $MVN_EXTRA
            displayName: Instalar JDK + Maven e gerar JAR

          - task: PublishBuildArtifacts@1
            displayName: Publicar JAR
            inputs:
              PathtoPublish: $(System.DefaultWorkingDirectory)/target/$(jarName)
              ArtifactName: app-jar
              publishLocation: pipeline

  - stage: CD_Deploy
    displayName: CD — Deploy Azure App Service
    dependsOn: CI_Build
    condition: succeeded()
    jobs:
      - job: DeployJar
        displayName: Deploy JAR
        steps:
          - download: current
            artifact: app-jar

          - task: AzureCLI@2
            displayName: az webapp deploy --type jar
            inputs:
              azureSubscription: REPLACE_AZURE_RM_CONNECTION
              scriptType: bash
              inlineScript: |
                set -euo pipefail
                JAR_PATH="$(Pipeline.Workspace)/app-jar/$(jarName)"
                test -f "$JAR_PATH"
                az webapp deploy \
                  --resource-group "$(AZURE_RESOURCE_GROUP)" \
                  --name "$(AZURE_WEBAPP_NAME)" \
                  --src-path "$JAR_PATH" \
                  --type jar
