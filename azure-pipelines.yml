trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  javaVersion: '21'
  acrLoginServer: '$(ACR_LOGIN_SERVER)'
  imageRepository: 'sos-localiza-api'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'CI — Maven, testes e imagem Docker'
    jobs:
      - job: BuildAndTest
        displayName: 'Testes, JAR e build Docker'
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '$(javaVersion)'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
            displayName: 'Java 21'

          - script: |
              chmod +x mvnw
              export SPRING_PROFILES_ACTIVE=test
              ./mvnw -B test
            displayName: 'Maven test (perfil test / H2)'

          - script: |
              ./mvnw -B package -DskipTests
            displayName: 'Maven package (JAR)'

          - script: |
              cp target/SosLocaliza-0.0.1-SNAPSHOT.jar app.jar
              ls -lh app.jar
            displayName: 'Preparar app.jar para Docker (CI)'

          - task: Docker@2
            displayName: 'Build imagem Docker (validação CI)'
            inputs:
              command: build
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(tag)
                latest

          - publish: '$(Build.SourcesDirectory)/target/SosLocaliza-0.0.1-SNAPSHOT.jar'
            artifact: sos-localiza-jar
            displayName: 'Publicar JAR (artefato)'

  - stage: DeployStaging
    displayName: 'CD — Deploy Staging'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployStagingJob
        displayName: 'Push ACR e Web App staging'
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - checkout: self

                - task: DownloadPipelineArtifact@2
                  displayName: 'Baixar JAR do estágio CI'
                  inputs:
                    buildType: current
                    artifactName: sos-localiza-jar
                    targetPath: '$(Build.SourcesDirectory)/target'

                - script: |
                    set -euo pipefail
                    mkdir -p target
                    JAR=target/SosLocaliza-0.0.1-SNAPSHOT.jar
                    if [ ! -f "$JAR" ]; then
                      FOUND="$(find "$(Pipeline.Workspace)" -name 'SosLocaliza-0.0.1-SNAPSHOT.jar' -type f | head -1)"
                      if [ -z "$FOUND" ]; then
                        echo "##vso[task.logissue type=error]JAR não encontrado no artefato CI"
                        find "$(Pipeline.Workspace)" -type f
                        exit 1
                      fi
                      cp "$FOUND" "$JAR"
                    fi
                    ls -lh "$JAR"
                    # Garante que o Docker enxerga o JAR no contexto (além do .dockerignore)
                    cp "$JAR" app.jar
                  displayName: 'Preparar JAR para Docker'

                - task: Docker@2
                  displayName: 'Login ACR'
                  inputs:
                    command: login
                    containerRegistry: '$(ACR_SERVICE_CONNECTION)'

                - task: Docker@2
                  displayName: 'Build e push (staging)'
                  inputs:
                    command: buildAndPush
                    repository: '$(imageRepository)'
                    dockerfile: '$(dockerfilePath)'
                    buildContext: '$(Build.SourcesDirectory)'
                    containerRegistry: '$(ACR_SERVICE_CONNECTION)'
                    tags: |
                      $(tag)-staging
                      staging-latest

                - task: AzureWebAppContainer@1
                  displayName: 'Atualizar Web App — Staging'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    resourceGroupName: '$(RESOURCE_GROUP)'
                    appName: '$(STAGING_WEBAPP_NAME)'
                    containers: '$(acrLoginServer)/$(imageRepository):$(tag)-staging'

  - stage: DeployProduction
    displayName: 'CD — Deploy Produção'
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - deployment: DeployProductionJob
        displayName: 'Push ACR e Web App produção'
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - checkout: self

                - task: DownloadPipelineArtifact@2
                  displayName: 'Baixar JAR do estágio CI'
                  inputs:
                    buildType: current
                    artifactName: sos-localiza-jar
                    targetPath: '$(Build.SourcesDirectory)/target'

                - script: |
                    set -euo pipefail
                    mkdir -p target
                    JAR=target/SosLocaliza-0.0.1-SNAPSHOT.jar
                    if [ ! -f "$JAR" ]; then
                      FOUND="$(find "$(Pipeline.Workspace)" -name 'SosLocaliza-0.0.1-SNAPSHOT.jar' -type f | head -1)"
                      if [ -z "$FOUND" ]; then
                        echo "##vso[task.logissue type=error]JAR não encontrado no artefato CI"
                        find "$(Pipeline.Workspace)" -type f
                        exit 1
                      fi
                      cp "$FOUND" "$JAR"
                    fi
                    ls -lh "$JAR"
                    cp "$JAR" app.jar
                  displayName: 'Preparar JAR para Docker'

                - task: Docker@2
                  displayName: 'Login ACR'
                  inputs:
                    command: login
                    containerRegistry: '$(ACR_SERVICE_CONNECTION)'

                - task: Docker@2
                  displayName: 'Build e push (produção)'
                  inputs:
                    command: buildAndPush
                    repository: '$(imageRepository)'
                    dockerfile: '$(dockerfilePath)'
                    buildContext: '$(Build.SourcesDirectory)'
                    containerRegistry: '$(ACR_SERVICE_CONNECTION)'
                    tags: |
                      $(tag)-prod
                      prod-latest

                - task: AzureWebAppContainer@1
                  displayName: 'Atualizar Web App — Produção'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    resourceGroupName: '$(RESOURCE_GROUP)'
                    appName: '$(PRODUCTION_WEBAPP_NAME)'
                    containers: '$(acrLoginServer)/$(imageRepository):$(tag)-prod'
