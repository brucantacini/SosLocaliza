# SOS Localiza — CI/CD Java (Spring Boot) + Docker + ACR + App Service
# Guia: devops/cp5_devops/GUIA_CICD_AZURE.md (variáveis e recursos Azure iguais; stack Java)
#
# Variáveis no Azure DevOps (Pipeline > Variables):
#   ACR_LOGIN_SERVER, ACR_SERVICE_CONNECTION, AZURE_SUBSCRIPTION,
#   RESOURCE_GROUP, STAGING_WEBAPP_NAME, PRODUCTION_WEBAPP_NAME

trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  javaVersion: '21'
  acrLoginServer: '$(ACR_LOGIN_SERVER)'
  imageRepository: 'sos-localiza-api'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'CI — Maven, testes e imagem Docker'
    jobs:
      - job: BuildAndTest
        displayName: 'Testes, JAR e build Docker'
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '$(javaVersion)'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
            displayName: 'Java 21'

          - script: |
              chmod +x mvnw
              export SPRING_PROFILES_ACTIVE=test
              ./mvnw -B test
            displayName: 'Maven test (perfil test / H2)'

          - script: |
              ./mvnw -B package -DskipTests
            displayName: 'Maven package (JAR)'

          - task: Docker@2
            displayName: 'Build imagem Docker (validação CI)'
            inputs:
              command: build
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(tag)
                latest

          - publish: '$(Build.SourcesDirectory)/target/SosLocaliza-0.0.1-SNAPSHOT.jar'
            artifact: sos-localiza-jar
            displayName: 'Publicar JAR (artefato)'

  - stage: DeployStaging
    displayName: 'CD — Deploy Staging'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployStagingJob
        displayName: 'Push ACR e Web App staging'
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Docker@2
                  displayName: 'Login ACR'
                  inputs:
                    command: login
                    containerRegistry: '$(ACR_SERVICE_CONNECTION)'

                - task: Docker@2
                  displayName: 'Build e push (staging)'
                  inputs:
                    command: buildAndPush
                    repository: '$(imageRepository)'
                    dockerfile: '$(dockerfilePath)'
                    buildContext: '$(Build.SourcesDirectory)'
                    containerRegistry: '$(ACR_SERVICE_CONNECTION)'
                    tags: |
                      $(tag)-staging
                      staging-latest

                - task: AzureWebAppContainer@1
                  displayName: 'Atualizar Web App — Staging'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    resourceGroupName: '$(RESOURCE_GROUP)'
                    appName: '$(STAGING_WEBAPP_NAME)'
                    containers: '$(acrLoginServer)/$(imageRepository):$(tag)-staging'

  - stage: DeployProduction
    displayName: 'CD — Deploy Produção'
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - deployment: DeployProductionJob
        displayName: 'Push ACR e Web App produção'
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Docker@2
                  displayName: 'Login ACR'
                  inputs:
                    command: login
                    containerRegistry: '$(ACR_SERVICE_CONNECTION)'

                - task: Docker@2
                  displayName: 'Build e push (produção)'
                  inputs:
                    command: buildAndPush
                    repository: '$(imageRepository)'
                    dockerfile: '$(dockerfilePath)'
                    buildContext: '$(Build.SourcesDirectory)'
                    containerRegistry: '$(ACR_SERVICE_CONNECTION)'
                    tags: |
                      $(tag)-prod
                      prod-latest

                - task: AzureWebAppContainer@1
                  displayName: 'Atualizar Web App — Produção'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    resourceGroupName: '$(RESOURCE_GROUP)'
                    appName: '$(PRODUCTION_WEBAPP_NAME)'
                    containers: '$(acrLoginServer)/$(imageRepository):$(tag)-prod'
