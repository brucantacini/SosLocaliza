# Docker Compose para SOS Localiza
# Orquestração da aplicação Spring Boot

version: '3.8'

services:
  soslocaliza:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soslocaliza-app
    ports:
      - "8081:8081"
    environment:
      # Perfil Spring Boot (Oracle produção / FIAP)
      - SPRING_PROFILES_ACTIVE=oracle-fiap
      # Defina no host ou num ficheiro .env na mesma pasta: ORACLE_USERNAME, ORACLE_PASSWORD
      # Opcional: SPRING_DATASOURCE_URL=jdbc:oracle:thin:@host:1521:ORCL
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
      - SPRING_DATASOURCE_USERNAME=${ORACLE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${ORACLE_PASSWORD}
    restart: unless-stopped
    networks:
      - soslocaliza-network
    # Executar em background (requisito: projeto em background)
    # Use: docker-compose up -d

networks:
  soslocaliza-network:
    driver: bridge

